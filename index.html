
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>X Hub Studio</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b1020;color:#fff;font-family:Arial,sans-serif}
header{padding:18px;background:#151f35;display:flex;justify-content:space-between;align-items:center}
h1{font-size:23px}
button{padding:12px;border:0;border-radius:9px;background:#7658ff;color:white;font-weight:bold;cursor:pointer}
input{padding:13px;width:100%;margin:8px 0;background:#101a30;color:white;border:1px solid #34415c;border-radius:8px}
.panel{background:#151f35;padding:20px;margin:15px;border-radius:13px}
#login{max-width:420px;margin:70px auto}
nav{display:flex;gap:10px;padding:12px}
nav button{flex:1}
.hidden{display:none!important}
.video{padding:14px;border-bottom:1px solid #34415c;display:flex;gap:10px;align-items:center}
.video span{flex:1;overflow-wrap:anywhere}
.danger{background:#b52d48}
.muted{color:#aab6ca}
</style>
</head>
<body>

<section id="login" class="panel">
<h1> X Hub Studio</h1>
<p class="muted">Creator Login</p>
<form id="loginForm">
<input id="email" type="email" placeholder="Gmail / Email" required>
<input id="password" type="password" placeholder="Password" required>
<button style="width:100%">Login</button>
</form>
<p id="loginError"></p>
</section>

<section id="studio" class="hidden">
<header>
<strong>X Hub Studio</strong>
<button id="logout">Logout</button>
</header>

<nav>
<button onclick="page('dashboard')">Dashboard</button>
<button onclick="page('content')">Content</button>
</nav>

<div id="dashboard" class="panel">
<h1>Dashboard</h1>
<p>Welcome to X Hub Studio</p>
<h2>My Videos: <span id="count">0</span></h2>
<button onclick="page('content')">Manage Videos</button>
</div>

<div id="content" class="hidden">
<div class="panel">
<h2>Upload Video</h2>
<form id="uploadForm">
<input id="title" placeholder="Video title" required>
<input id="file" type="file" accept="video/*" required>
<button id="uploadBtn">Upload Video</button>
</form>
<p id="message"></p>
</div>
<div class="panel">
<h2>My Videos</h2>
<div id="videos">Loading...</div>
</div>
</div>
</section>

<script>
const SUPABASE_URL="https://scczyiossqleuzidplxx.supabase.co";
const SUPABASE_KEY="sb_publishable_rvecUf_3ZkeAxnbAJ8iiiw_2mItGPT2";
const BUCKET="Videos";

const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{
 auth:{persistSession:true,autoRefreshToken:true}
});

let user=null;
const el=id=>document.getElementById(id);

function showStudio(u){
 user=u;
 el("login").classList.add("hidden");
 el("studio").classList.remove("hidden");
 loadVideos();
}

function showLogin(){
 user=null;
 el("studio").classList.add("hidden");
 el("login").classList.remove("hidden");
}

function page(name){
 el("dashboard").classList.toggle("hidden",name!=="dashboard");
 el("content").classList.toggle("hidden",name!=="content");
 if(name==="content")loadVideos();
}

el("loginForm").addEventListener("submit",async e=>{
 e.preventDefault();
 el("loginError").textContent="Logging in...";
 const {data,error}=await sb.auth.signInWithPassword({
  email:el("email").value.trim(),
  password:el("password").value
 });
 if(error){
  el("loginError").textContent=error.message;
  return;
 }
 el("loginError").textContent="";
 showStudio(data.user);
});

el("logout").onclick=async()=>{
 await sb.auth.signOut();
 showLogin();
};

async function loadVideos(){
 if(!user)return;
 el("videos").textContent="Loading videos...";
 const {data,error}=await sb.from("videos")
  .select("*")
  .eq("user_id",user.id)
  .order("created_at",{ascending:false});

 if(error){
  el("videos").textContent=error.message;
  return;
 }

 el("count").textContent=data.length;
 el("videos").innerHTML="";

 if(!data.length){
  el("videos").textContent="No videos uploaded yet.";
  return;
 }

 data.forEach(v=>{
  const row=document.createElement("div");
  row.className="video";

  const name=document.createElement("span");
  name.textContent=v.title||"Untitled";

  const edit=document.createElement("button");
  edit.textContent="✏️";
  edit.onclick=()=>editTitle(v);

  const del=document.createElement("button");
  del.textContent="Delete";
  del.className="danger";
  del.onclick=()=>deleteVideo(v);

  row.append(name,edit,del);
  el("videos").append(row);
 });
}

async function editTitle(v){
 const title=prompt("Enter new video title:",v.title||"");
 if(title===null)return;
 if(!title.trim())return alert("Title cannot be empty");

 const {error}=await sb.from("videos")
  .update({title:title.trim()})
  .eq("id",v.id)
  .eq("user_id",user.id);

 if(error)alert(error.message);
 else{
  alert("Title updated");
  loadVideos();
 }
}

async function deleteVideo(v){
 if(!confirm("Delete this video?"))return;

 if(v.file_path){
  const {error}=await sb.storage.from(BUCKET).remove([v.file_path]);
  if(error)return alert(error.message);
 }

 const {error}=await sb.from("videos")
  .delete()
  .eq("id",v.id)
  .eq("user_id",user.id);

 if(error)alert(error.message);
 else{
  alert("Video deleted");
  loadVideos();
 }
}

el("uploadForm").addEventListener("submit",async e=>{
 e.preventDefault();
 if(!user)return;

 const file=el("file").files[0];
 const title=el("title").value.trim();
 if(!file||!title)return;

 const btn=el("uploadBtn");
 btn.disabled=true;
 btn.textContent="Uploading...";

 const safeName=file.name.replace(/[^a-zA-Z0-9._-]/g,"_");
 const path=user.id+"/"+Date.now()+"_"+safeName;

 const {error:uploadError}=await sb.storage.from(BUCKET)
  .upload(path,file,{contentType:file.type});

 if(uploadError){
  el("message").textContent=uploadError.message;
  btn.disabled=false;
  btn.textContent="Upload Video";
  return;
 }

 const {error}=await sb.from("videos").insert({
  title:title,
  file_path:path,
  user_id:user.id
 });

 if(error){
  await sb.storage.from(BUCKET).remove([path]);
  el("message").textContent=error.message;
 }else{
  el("message").textContent="Video uploaded successfully!";
  el("uploadForm").reset();
  loadVideos();
 }

 btn.disabled=false;
 btn.textContent="Upload Video";
});

sb.auth.onAuthStateChange((event,session)=>{
 if(session?.user)showStudio(session.user);
 else if(event==="SIGNED_OUT")showLogin();
});

(async()=>{
 const {data}=await sb.auth.getSession();
 if(data.session?.user)showStudio(data.session.user);
})();
</script>
</body>
  </html>
