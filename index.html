<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Xhub Creator Studio</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'sans-serif'] },
          colors: {
            studioBg: '#0f0f0f',
            studioCard: '#1f1f1f',
            studioHover: '#2e2e2e',
            studioBorder: '#2d2d2d',
            xhubRed: '#ff0000'
          }
        }
      }
    }
  </script>
</head>
<body class="bg-studioBg text-gray-100 font-sans antialiased pb-20 selection:bg-red-600 selection:text-white">

  <!-- TOP HEADER (Notifications removed, Create button retained) -->
  <header class="sticky top-0 z-40 h-14 bg-studioCard border-b border-studioBorder px-4 flex items-center justify-between">
    <div class="flex items-center gap-2">
      <div class="w-7 h-5 bg-xhubRed rounded flex items-center justify-center text-white text-[10px]">
        <i class="fa-solid fa-play"></i>
      </div>
      <span class="font-extrabold text-base tracking-tight text-white">Studio</span>
    </div>

    <div class="flex items-center gap-3">
      <button onclick="openUploadModal()" class="w-9 h-9 rounded-full bg-studioHover flex items-center justify-center text-white text-sm hover:bg-zinc-700">
        <i class="fa-solid fa-plus"></i>
      </button>
      <img id="header-avatar" src="https://api.dicebear.com/7.x/avataaars/svg?seed=NGTHAKOR" alt="Avatar" class="w-8 h-8 rounded-full border border-zinc-700 object-cover bg-zinc-800" />
    </div>
  </header>

  <!-- MAIN WORKSPACE -->
  <main class="max-w-md mx-auto p-4 space-y-6">
    
    <!-- 1. CHANNEL HEADER & SUBSCRIBERS -->
    <div class="flex items-center gap-4 bg-studioCard border border-studioBorder rounded-2xl p-4 shadow-lg">
      <img id="channel-avatar" src="https://api.dicebear.com/7.x/avataaars/svg?seed=NGTHAKOR" class="w-16 h-16 rounded-full border-2 border-red-600 object-cover bg-zinc-800" />
      <div>
        <h2 id="channel-name" class="text-base font-extrabold text-white">NG THAKOR 117</h2>
        <p id="channel-subs" class="text-xl font-bold text-white mt-0.5">337</p>
        <p class="text-[11px] text-gray-400">Total subscribers</p>
      </div>
    </div>

    <!-- 2. CHANNEL ANALYTICS (Views, Watch time, Subscribers (28 days), Extra Custom Box) -->
    <div class="space-y-3">
      <div class="flex items-center justify-between px-1">
        <h3 class="text-sm font-bold text-white">Channel analytics</h3>
        <span class="text-[11px] text-gray-400">Last 28 days</span>
      </div>

      <div class="grid grid-cols-2 gap-3">
        <!-- Views Box -->
        <div class="bg-studioCard border border-studioBorder rounded-2xl p-4 space-y-1">
          <p class="text-xs text-gray-400">Views</p>
          <div class="flex items-center gap-2">
            <span id="stat-views" class="text-xl font-extrabold text-white">28</span>
            <span class="text-xs text-emerald-400 font-bold"><i class="fa-solid fa-arrow-down text-[10px]"></i></span>
          </div>
        </div>

        <!-- Watch Time Box -->
        <div class="bg-studioCard border border-studioBorder rounded-2xl p-4 space-y-1">
          <p class="text-xs text-gray-400">Watch time (hours)</p>
          <div class="flex items-center gap-2">
            <span id="stat-watchtime" class="text-xl font-extrabold text-white">0.1</span>
            <span class="text-xs text-emerald-400 font-bold"><i class="fa-solid fa-arrow-down text-[10px]"></i></span>
          </div>
        </div>

        <!-- Subscribers Box (Last 28 days) -->
        <div class="bg-studioCard border border-studioBorder rounded-2xl p-4 space-y-1">
          <p class="text-xs text-gray-400">Subscribers (28d)</p>
          <div class="flex items-center gap-2">
            <span id="stat-sub-28" class="text-xl font-extrabold text-white">+12</span>
            <span class="text-xs text-emerald-500 font-bold"><i class="fa-solid fa-arrow-up text-[10px]"></i></span>
          </div>
        </div>

        <!-- Extra Custom Box for Ads / Sponsors / Widgets -->
        <div class="bg-studioCard border border-studioBorder rounded-2xl p-4 space-y-1 relative overflow-hidden group">
          <div class="flex items-center justify-between">
            <p class="text-xs text-gray-400">Sponsor / Ad Slot</p>
            <i class="fa-solid fa-bolt text-amber-400 text-xs"></i>
          </div>
          <p class="text-xs font-bold text-amber-300 truncate">Active Banner</p>
          <a href="#" onclick="openEarnSettings()" class="text-[10px] text-blue-400 underline block">Manage slot</a>
        </div>
      </div>
    </div>

    <!-- 3. LATEST PUBLISHED CONTENT (Comments removed from video cards) -->
    <div class="space-y-3">
      <h3 class="text-sm font-bold text-white px-1">Latest published content</h3>
      <div id="content-videos-list" class="space-y-3"></div>
    </div>

  </main>

  <!-- BOTTOM MOBILE NAVIGATION (Community Tab Removed, 4 Tabs: Dashboard, Content, Analytics, Earn) -->
  <nav class="fixed bottom-0 inset-x-0 bg-studioCard border-t border-studioBorder h-16 flex items-center justify-around px-2 z-40 text-xs">
    <button onclick="switchTab('dashboard')" class="nav-btn flex flex-col items-center gap-1 text-xhubRed font-semibold" data-tab="dashboard">
      <i class="fa-solid fa-table-columns text-base"></i>
      <span>Dashboard</span>
    </button>
    <button onclick="switchTab('content')" class="nav-btn flex flex-col items-center gap-1 text-gray-400 hover:text-white" data-tab="content">
      <i class="fa-solid fa-film text-base"></i>
      <span>Content</span>
    </button>
    <button onclick="switchTab('analytics')" class="nav-btn flex flex-col items-center gap-1 text-gray-400 hover:text-white" data-tab="analytics">
      <i class="fa-solid fa-chart-column text-base"></i>
      <span>Analytics</span>
    </button>
    <button onclick="switchTab('earn')" class="nav-btn flex flex-col items-center gap-1 text-gray-400 hover:text-white" data-tab="earn">
      <i class="fa-solid fa-dollar-sign text-base"></i>
      <span>Earn</span>
    </button>
  </nav>

  <!-- UPLOAD MODAL -->
  <div id="upload-modal" class="fixed inset-0 z-50 hidden bg-black/80 flex items-center justify-center p-4">
    <div class="w-full max-w-sm bg-studioCard border border-studioBorder rounded-2xl p-5 space-y-4 shadow-2xl">
      <div class="flex items-center justify-between border-b border-studioBorder pb-2">
        <h3 class="text-sm font-bold text-white">Upload video</h3>
        <button onclick="closeUploadModal()" class="text-gray-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div class="space-y-3 text-xs">
        <div>
          <label class="block text-gray-400 mb-1">Title</label>
          <input id="up-title" type="text" placeholder="Video title..." class="w-full px-3 py-2 rounded-xl bg-studioBg border border-studioBorder text-white" />
        </div>
        <div>
          <label class="block text-gray-400 mb-1">Video File</label>
          <input id="up-file" type="file" accept="video/*" class="w-full text-gray-300" />
        </div>
      </div>
      <div class="flex justify-end gap-2 pt-2">
        <button onclick="closeUploadModal()" class="px-3 py-1.5 rounded-xl bg-studioHover text-xs font-semibold">Cancel</button>
        <button onclick="uploadVideo()" class="px-4 py-1.5 rounded-xl bg-xhubRed text-white text-xs font-semibold">Upload</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = "https://scczyiossqleuzidplxx.supabase.co";
    const SUPABASE_KEY = "sb_publishable_rvecUf_3ZkeAxnbAJ8iiiw_2mItGPT2";
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let channelVideos = [];

    async function initStudio() {
      const { data: videos } = await sb.from('videos').select('*').order('created_at', { ascending: false });
      channelVideos = videos || [];
      
      const totalViews = channelVideos.reduce((s, v) => s + (v.views || 0), 0);
      document.getElementById('stat-views').textContent = totalViews || 28;

      renderVideosList(channelVideos);
    }

    function renderVideosList(list) {
      const box = document.getElementById('content-videos-list');
      if (!list.length) {
        box.innerHTML = `<div class="bg-studioCard border border-studioBorder rounded-2xl p-4 text-center text-xs text-gray-400">No videos uploaded yet.</div>`;
        return;
      }
      box.innerHTML = list.map(v => `
        <div class="bg-studioCard border border-studioBorder rounded-2xl p-3 flex gap-3 items-center">
          <div class="w-24 h-14 bg-zinc-900 rounded-xl overflow-hidden shrink-0 relative flex items-center justify-center border border-studioBorder">
            <video src="${v.video_url || ''}" class="w-full h-full object-cover"></video>
            <div class="absolute inset-0 bg-black/20"></div>
          </div>
          <div class="flex-1 min-w-0 space-y-1">
            <p class="text-xs font-semibold text-white truncate">${v.title}</p>
            <p class="text-[11px] text-gray-400">First 31 days, 3 hours</p>
            <div class="flex items-center gap-4 text-[11px] text-gray-300 pt-1">
              <span><i class="fa-solid fa-chart-bar mr-1 text-blue-400"></i> ${v.views || 0}</span>
              <span><i class="fa-solid fa-thumbs-up mr-1 text-emerald-400"></i> ${v.likes || 0}</span>
            </div>
          </div>
          <button onclick="deleteVid('${v.id}')" class="text-gray-500 hover:text-red-500 px-2 text-xs"><i class="fa-solid fa-trash"></i></button>
        </div>
      `).join('');
    }

    function openUploadModal() { document.getElementById('upload-modal').classList.remove('hidden'); }
    function closeUploadModal() { document.getElementById('upload-modal').classList.add('hidden'); }

    async function uploadVideo() {
      const title = document.getElementById('up-title').value.trim();
      const file = document.getElementById('up-file').files[0];
      if (!title || !file) return alert('Enter title and select file');

      const filePath = `vid_${Date.now()}_${file.name}`;
      await sb.storage.from('Videos').upload(filePath, file);
      const { data: pub } = sb.storage.from('Videos').getPublicUrl(filePath);
      
      await sb.from('videos').insert([{ title, video_url: pub.publicUrl, file_path: filePath, views: 0, likes: 0 }]);
      closeUploadModal();
      initStudio();
    }

    async function deleteVid(id) {
      if (!confirm('Delete video?')) return;
      await sb.from('videos').delete().eq('id', id);
      initStudio();
    }

    function switchTab(tab) {
      document.querySelectorAll('.nav-btn').forEach(btn => {
        const active = btn.getAttribute('data-tab') === tab;
        btn.className = active 
          ? 'nav-btn flex flex-col items-center gap-1 text-xhubRed font-semibold' 
          : 'nav-btn flex flex-col items-center gap-1 text-gray-400 hover:text-white';
      });
      if(tab === 'earn') alert('Sponsor & Banner ad slot manager is ready in the extra box!');
    }

    function openEarnSettings() {
      alert('Aap yahan apna custom Ad code ya Banner link set kar sakte hain!');
    }

    window.addEventListener('DOMContentLoaded', initStudio);
  </script>
</body>
</html>
